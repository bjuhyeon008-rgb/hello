<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>평행선 찾기 활동</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--fg:#1d2733;--mut:#5d6b7a;--line:#cfd8e3;--acc:#2f6fed;--accbg:#e6eeff;--ok:#1f9d55;--bad:#d64545;--ink:#1d2733;--sky:#d6ebff;--grass:#c4e8b4;--box:#e9eef5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#18212b;--fg:#e8eef5;--mut:#9aa8b6;--line:#2d3a48;--acc:#6b9bff;--accbg:#1f2f4d;--ok:#3ccf7d;--bad:#ff7070;--ink:#e8eef5;--sky:#1d3350;--grass:#25402b;--box:#243241}}
:root[data-theme="dark"]{--bg:#10161d;--card:#18212b;--fg:#e8eef5;--mut:#9aa8b6;--line:#2d3a48;--acc:#6b9bff;--accbg:#1f2f4d;--ok:#3ccf7d;--bad:#ff7070;--ink:#e8eef5;--sky:#1d3350;--grass:#25402b;--box:#243241}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
#app{max-width:760px;margin:0 auto;padding:12px}
h2{margin:6px 0}
.top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
button{font:inherit;cursor:pointer}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 12px}
.fig,.scene{width:100%;display:block;background:var(--card);border:1px solid var(--line);border-radius:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:10px 0}
.q{margin:6px 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.row{display:flex;gap:8px;margin:8px 0}.col{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.ch{flex:1;background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.ch.on{border-color:var(--acc);background:var(--accbg)}
.go{width:100%;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700}
.go:disabled{opacity:.4}
.ln{stroke:#ff6a00;stroke-width:5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.ref{stroke:#2f6fed}
.hl{stroke:#fff;stroke-width:9;stroke-linecap:round;opacity:.9;vector-effect:non-scaling-stroke}
.ex{stroke:var(--bad);stroke-width:1.6;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.lab{font-size:18px;font-weight:800;fill:#111;stroke:#fff;stroke-width:4px;paint-order:stroke;text-anchor:middle;dominant-baseline:central}
.ang{font-size:13px;font-weight:800;fill:#0b7a3b;stroke:#fff;stroke-width:3px;paint-order:stroke;text-anchor:middle;dominant-baseline:central}
.ang.x{fill:#c62828}
.ra{fill:none;stroke:#0b7a3b;stroke-width:2.5}
.pin{cursor:pointer}.pn{font-size:14px;font-weight:800;fill:#fff}
.pl{font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px;text-anchor:middle}
.msg{font-size:18px;font-weight:800;margin:0 0 4px}
.chest{font-size:64px;text-align:center}
.item{display:flex;justify-content:space-between;width:100%;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0}
.mut{color:var(--mut)}
textarea{width:100%;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg);font:inherit;resize:vertical;margin:6px 0}
.tag{min-width:72px;align-self:center;font-weight:700}.hint{color:var(--bad);font-weight:700;margin:4px 0}
.ip{flex:1;min-width:150px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.cert{border:6px double #b8860b;border-radius:16px;padding:22px;text-align:center;background:#fffdf3;color:#222}.cert h1{margin:4px 0;font-size:28px;color:#8a5a00}.seal{font-size:52px}
.who{font-size:22px;font-weight:800;border-bottom:2px solid #b8860b;display:inline-block;min-width:200px;margin:6px 0}
.cert table{margin:10px auto;border-collapse:collapse;font-size:14px}.cert td{padding:2px 12px;border-bottom:1px dotted #bbb}.dt{font-weight:700}
#sheet{display:none}#cert{display:none}
@media print{
 body{background:#fff;color:#000}#app{display:none!important}#sheet{display:block;color:#000}body.pcert #sheet{display:none!important}body.pcert #cert{display:block!important}body.pcert #cert .cert{margin:10mm auto;max-width:180mm}
 @page{size:A4;margin:10mm}
 .page{page-break-after:always}.page h3{margin:0 0 6mm;font-size:15pt}
 .grid{display:grid;grid-template-columns:90mm 90mm;gap:6mm 10mm}
 .cell h4{margin:0 0 2mm;font-size:11pt}.cell p{margin:1.5mm 0;font-size:10pt}
 #sheet svg{border:.3mm solid #999}
 #sheet .hl{display:none}#sheet .ln{stroke:#111;stroke-width:2}#sheet .ref{stroke:#111;stroke-dasharray:5 3}#sheet .lab{fill:#111}
}
</style></head><body>
<div id="app"></div>
<div id="sheet"></div>
<script>
const $=s=>document.querySelector(s),rad=d=>d*Math.PI/180,C={x:200,y:140},R0=120,H=100;
const Z=[
{n:'교문 철문',th:0,s:90,d:[0,0],x:45,y:215},
{n:'계단 난간',th:-35,s:90,d:[0,0],x:150,y:185},
{n:'축구 골대',th:0,s:90,d:[0,5],x:338,y:232},
{n:'지붕 창틀',th:55,s:75,d:[0,0],x:200,y:95},
{n:'철봉',th:-25,s:90,d:[-5,0],x:255,y:200},
{n:'타일 복도',th:-20,s:70,d:[0,0],x:150,y:255},
{n:'체육관 바닥',th:10,s:45,d:[0,-5],x:335,y:110},
{n:'놀이기구',th:65,s:80,d:[5,-5],x:50,y:105}];
const RS=['나와 다가 모두 가에 수직(90°)이다','나와 다 중에 가에 수직이 아닌 선이 있다','두 직선이 거의 같은 방향으로 보인다'];
let S={view:'map',res:{},cur:null,pick:null,why:null,zoom:false};
const isPar=z=>z.d[0]===z.d[1];
function geom(z){const t=rad(z.th),u={x:Math.cos(t),y:Math.sin(t)};
 return{u,lines:[-1,1].map((k,i)=>{const a=rad(z.th+90+z.d[i]);return{p:{x:C.x+k*z.s*u.x,y:C.y+k*z.s*u.y},dir:{x:Math.cos(a),y:Math.sin(a)}}})}}
function meetOf(z){const[a,b]=geom(z).lines,det=-a.dir.x*b.dir.y+b.dir.x*a.dir.y;if(Math.abs(det)<1e-6)return null;
 const t=(-(b.p.x-a.p.x)*b.dir.y+b.dir.x*(b.p.y-a.p.y))/det,m={x:a.p.x+t*a.dir.x,y:a.p.y+t*a.dir.y};
 return Math.hypot(m.x-C.x,m.y-C.y)>2500?null:m}
function scene(i,L,seg,u){
 const[A,B]=L,r={p:C,dir:u},E=120,
 b=(l,w,c)=>`<line ${seg(l.p,l.dir,E)} stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`,
 R=(y,h,c)=>`<rect x="-4000" y="${y}" width="8000" height="${h}" fill="${c}"/>`,
 sky=(a,g)=>R(-4000,4140,a)+R(140,4000,g),
 pt=(l,k)=>`${(l.p.x+k*l.dir.x*E).toFixed(1)},${(l.p.y+k*l.dir.y*E).toFixed(1)}`,
 two=(w,c)=>b(A,w,c)+b(B,w,c);
 let s='';
 switch(i){
 case 0:s=sky('#bcd6ea','#7e8c6a')+b(r,10,'#9aa1a8')+two(16,'#2f353b')+two(4,'#7d8791');break;
 case 1:s=R(-4000,8000,'#e8dcc8')+b(r,10,'#b9ad98')+two(12,'#4d5966')+two(4,'#9fb0c0');break;
 case 2:s=sky('#a9d4f0','#5fa35a')+b(r,17,'#333')+two(17,'#333')+b(r,12,'#fff')+two(12,'#fff');break;
 case 3:s=R(-4000,8000,'#d9c9b2')+`<polygon points="${pt(A,-1)} ${pt(A,1)} ${pt(B,1)} ${pt(B,-1)}" fill="#bfe3f5"/>`+b(r,10,'#7a5230')+two(14,'#7a5230');break;
 case 4:s=sky('#c6e3f7','#8bbf7a')+b(r,13,'#555')+two(13,'#555')+b(r,8,'#b8c0c8')+two(8,'#b8c0c8');break;
 case 5:s=R(-4000,8000,'#efe6d2');[A,B].forEach((l,j)=>{const a=rad((j?1:-1)*50),c=Math.cos(a),n=Math.sin(a),hx=l.dir.x*c-l.dir.y*n,hy=l.dir.x*n+l.dir.y*c;for(let t=-100;t<=100;t+=16){const x=l.p.x+l.dir.x*t,y=l.p.y+l.dir.y*t;s+=`<line x1="${(x-hx*20).toFixed(1)}" y1="${(y-hy*20).toFixed(1)}" x2="${(x+hx*20).toFixed(1)}" y2="${(y+hy*20).toFixed(1)}" stroke="#333" stroke-width="2.5"/>`}});s+=b(r,6,'#bba98a');break;
 case 6:s=R(-4000,8000,'#d8a65f');for(let y=-840;y<1200;y+=28)s+=`<line x1="-3000" y1="${y}" x2="3000" y2="${y}" stroke="#b9853f" stroke-width="2"/>`;s+=b(r,9,'#ffd43b')+two(9,'#fff');break;
 default:s=sky('#cfe7f9','#6c8f61')+b(r,10,'#8a8f95')+two(10,'#4a535c')+two(3,'#c9d2da')}
 return s}
function fig(z,o={}){
 const{u,lines}=geom(z),f=n=>n.toFixed(1);
 const seg=(p,d,h)=>`x1="${f(p.x-d.x*h)}" y1="${f(p.y-d.y*h)}" x2="${f(p.x+d.x*h)}" y2="${f(p.y+d.y*h)}"`;
 const lp=(p,d,h)=>{for(const k of[1,-1]){const x=p.x+k*d.x*h,y=p.y+k*d.y*h;if(x>14&&x<386&&y>16&&y<272)return[x,y]}return[p.x,p.y]};
 const lab=(t,[x,y])=>`<text class="lab" x="${f(x)}" y="${f(y)}">${t}</text>`;
 let s=scene(Z.indexOf(z),lines,seg,u);
 if(o.fb){const m=meetOf(z);
  s+=`<g id="ext" style="display:none">${lines.map(l=>`<line ${seg(l.p,l.dir,6000)} class="ex"/>`).join('')}<line ${seg(C,u,6000)} class="ex"/>${m?`<circle id="mk" cx="${f(m.x)}" cy="${f(m.y)}" r="7" fill="var(--bad)"/>`:''}</g>`}
 const ml=(p,d,h,c)=>`<line ${seg(p,d,h)} class="hl"/><line ${seg(p,d,h)} class="ln ${c}"/>`;
 s+=ml(C,u,R0,'ref')+lines.map(l=>ml(l.p,l.dir,H,'')).join('');
 s+=lab('가',lp(C,u,R0+8))+lab('나',lp(lines[0].p,lines[0].dir,H+14))+lab('다',lp(lines[1].p,lines[1].dir,H+14));
 if(o.fb)s+=`<g id="fb">`+lines.map((l,i)=>{const d=z.d[i],p=l.p,q=(a,b)=>`${f(p.x+u.x*a+l.dir.x*b)},${f(p.y+u.y*a+l.dir.y*b)}`;
  const bx=u.x+l.dir.x,by=u.y+l.dir.y,bl=Math.hypot(bx,by)||1;
  return(d===0?`<path class="ra" d="M${q(14,0)}L${q(14,14)}L${q(0,14)}"/>`:'')+`<text class="ang ${d?'x':''}" x="${f(p.x+34*bx/bl)}" y="${f(p.y+34*by/bl)}">${90+d}°</text>`}).join('')+`</g>`;
 return s}
function mapHTML(){
 const done=Object.keys(S.res).length,ok=Object.values(S.res).filter(r=>r.ok).length;
 const pins=Z.map((z,i)=>{const r=S.res[i],lk=i>0&&!S.res[i-1],c=r?(r.ok?'var(--ok)':'var(--bad)'):lk?'#8a94a0':'var(--acc)';
  return`<g class="pin" onclick="openZone(${i})"><circle cx="${z.x}" cy="${z.y}" r="15" fill="${c}"/><text x="${z.x}" y="${z.y+5}" text-anchor="middle" class="pn">${r?(r.ok?'✓':'✗'):lk?'🔒':i+1}</text><text x="${z.x}" y="${z.y+31}" class="pl">${i>5?'⭐':''}${z.n}</text></g>`}).join('');
 return`<h2>🗺️ 평행선 찾기 활동</h2><p class="q">1번부터 차례대로 열려요. 기본 문제는 6개, 7·8번은 ⭐보너스예요. 번호를 눌러 구역으로 가요. 삼각자로 <b>90°인지 아닌지</b> 확인하고, 두 직선이 평행선인지 판단해 보세요!</p>
 <svg class="scene" viewBox="0 0 400 300"><rect width="400" height="300" fill="var(--sky)"/><rect y="170" width="400" height="130" fill="var(--grass)"/>
 <rect x="120" y="50" width="160" height="112" rx="4" fill="var(--box)" stroke="var(--line)"/><rect x="295" y="82" width="85" height="78" rx="4" fill="var(--box)" stroke="var(--line)"/>
 <g fill="var(--card)" stroke="var(--line)"><rect x="135" y="66" width="30" height="24"/><rect x="235" y="66" width="30" height="24"/><rect x="135" y="112" width="30" height="24"/><rect x="235" y="112" width="30" height="24"/></g>
 <ellipse cx="150" cy="255" rx="92" ry="34" fill="none" stroke="var(--card)" stroke-width="6"/><circle cx="50" cy="105" r="36" fill="none" stroke="var(--line)" stroke-width="4"/><path d="M50 141l-22 30M50 141l22 30" stroke="var(--line)" stroke-width="4"/>
 ${pins}</svg>
 <div class="bar"><b>⭐ 성공 ${ok}개 · 푼 구역 ${done}/8</b><span><button class="ghost" onclick="window.print()">🖨️ 활동지 인쇄</button> <button class="ghost" onclick="go('res')">📋 결과·푼 문제</button></span></div>`}
function ask(){
 const b=(k,t,on,fn)=>`<button class="ch ${on?'on':''}" onclick="${fn}(${k})">${t}</button>`;
 return`<div class="box"><b>① 직선 나와 다는 평행선일까요?</b><div class="row">${b(1,'평행하다',S.pick===1,'pk')}${b(0,'평행하지 않다',S.pick===0,'pk')}</div>
 ${S.pick!==null?`<b>② 그렇게 생각한 이유는?</b><div class="col">${RS.map((t,k)=>b(k,t,S.why===k,'wy')).join('')}</div>`:''}
 <button class="go" ${S.pick!==null&&S.why!==null?'':'disabled'} onclick="submit()">확인하기</button></div>`}
function review(z,r){
 const par=isPar(z),A=z.d.map(d=>90+d),all=Object.keys(S.res).length===8;
 const msg=r.ok?'🎉 정답! 보물을 찾았어요!':r.aOk?'답은 맞았어요! 이유를 다시 살펴봐요.':'아쉬워요. 같이 확인해 봐요.';
 return`<div class="box"><p class="msg">${msg}</p>
 <p>직선 가와 만나는 각: 나 <b>${A[0]}°</b>, 다 <b>${A[1]}°</b></p>
 <p>${par?'나와 다가 모두 가에 수직(90°)이라서 평행선이에요. 아무리 늘여도 만나지 않아요.':'가에 수직이 아닌 선이 있어서 평행선이 아니에요. 선을 늘이면 빨간 점에서 만나요.'}</p>
 <p class="mut">내 답: ${r.pick?'평행하다':'평행하지 않다'} · 이유: ${RS[r.why]}</p>
 <div class="bar"><button class="ghost" id="zb" onclick="zoom(!S.zoom)">🔭 선 늘여 보기</button><button class="go" style="width:auto;padding:10px 18px" onclick="${all?"go('res')":'nextZone()'}">${all?'결과 보기':'다음 구역 →'}</button></div></div>`}
function zoneHTML(){const i=S.cur,z=Z[i],r=S.res[i];
 return`<div class="top"><button class="ghost" onclick="go('map')">← 지도</button><b>${i+1}구역 · ${z.n}</b></div>
 <p class="q">삼각자로 직선 <b>가</b>와 직선 <b>나</b>, <b>다</b>가 만나는 각이 <b>90°</b>인지 확인해 보세요.</p>
 <svg id="fig" class="fig" viewBox="0 0 400 280">${fig(z,{fb:!!r})}</svg>${r?review(z,r):ask()}`}
function resHTML(){
 const ok=Object.values(S.res).filter(r=>r.ok).length,w=ok>=6;
 return`<div class="top"><button class="ghost" onclick="go('map')">← 지도</button><b>보물 결과</b></div>
 <div class="chest">${w?'🏆':'🔒'}</div><h2 style="text-align:center">${w?'보물 상자가 열렸어요!':'열쇠 조각 '+ok+'/6 · 6개를 모으면 열려요'}</h2><p class="mut" style="text-align:center">8구역 중 ${ok}개 성공 · 구역을 눌러 문제를 다시 볼 수 있어요</p>
 ${Z.map((z,i)=>{const r=S.res[i];return`<button class="item" onclick="openZone(${i})"><span>${i+1}. ${z.n}</span><b style="color:${r?(r.ok?'var(--ok)':'var(--bad)'):'var(--mut)'}">${r?(r.ok?'✓ 맞춤':'✗ 틀림'):'아직'}</b></button>`}).join('')}
 <button class="go" style="margin-top:10px" onclick="S.res={};go('map')">처음부터 다시 하기</button>`}
function render(){$('#app').innerHTML=S.view==='map'?mapHTML():S.view==='zone'?zoneHTML():resHTML();window.scrollTo(0,0)}
function go(v){S.view=v;render()}
function openZone(i){S.cur=i;S.pick=S.why=null;S.zoom=false;go('zone')}
function pk(k){S.pick=k;render()}function wy(k){S.why=k;render()}
function nextZone(){for(let k=1;k<=8;k++){const i=(S.cur+k)%8;if(!S.res[i])return openZone(i)}go('res')}
function submit(){const z=Z[S.cur],par=isPar(z),aOk=(S.pick===1)===par,rOk=S.why===(par?0:1);
 S.res[S.cur]={ok:aOk&&rOk,pick:S.pick,why:S.why,aOk,rOk};S.pick=S.why=null;S.zoom=false;render();
 if(!(aOk&&rOk))setTimeout(()=>zoom(true),700)}
function target(z){const m=meetOf(z);let x0=0,y0=0,x1=400,y1=280,mw=1600;
 if(m){x0=Math.min(x0,m.x);x1=Math.max(x1,m.x);y0=Math.min(y0,m.y);y1=Math.max(y1,m.y);mw=(m.x>0&&m.x<400&&m.y>0&&m.y<280)?520:800}
 x0-=40;y0-=40;x1+=40;y1+=40;const w=Math.max(x1-x0,(y1-y0)*400/280,mw),h=w*.7,cx=m?(x0+x1)/2:200,cy=m?(y0+y1)/2:140;
 return[cx-w/2,cy-h/2,w,h]}
function zoom(on){const svg=$('#fig');if(!svg||!$('#ext'))return;S.zoom=on;
 const from=svg.getAttribute('viewBox').split(' ').map(Number),to=on?target(Z[S.cur]):[0,0,400,280];
 if(on){$('#ext').style.display='block';$('#fb').style.display='none'}else $('#fb').style.display='block';
 const b=$('#zb');if(b)b.textContent=on?'↩️ 원래대로':'🔭 선 늘여 보기';
 const t0=performance.now();
 (function step(t){const k=Math.min(1,(t-t0)/900),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,v=from.map((a,j)=>a+(to[j]-a)*e),sc=v[2]/400;
  svg.setAttribute('viewBox',v.join(' '));svg.querySelectorAll('.lab').forEach(x=>x.style.fontSize=18*sc+'px');
  const mk=$('#mk');if(mk)mk.setAttribute('r',7*sc);
  if(k<1)requestAnimationFrame(step);else if(!on)$('#ext').style.display='none'})(t0)}
function sheet(){
 const cell=(z,i)=>`<div class="cell"><h4>${'①②③④⑤⑥⑦⑧'[i]} ${z.n}</h4><svg width="90mm" height="63mm" viewBox="0 0 400 280">${fig(z)}</svg><p>삼각자로 잰 각: 나 ______° 다 ______°</p><p>□ 평행하다 &nbsp;&nbsp; □ 평행하지 않다</p><p>이유: ______________________</p></div>`;
 const pg=a=>`<section class="page"><h3>🗺️ 학교 보물찾기 활동지 <small>이름: __________</small></h3><div class="grid">${a.map(([z,i])=>cell(z,i)).join('')}</div></section>`;
